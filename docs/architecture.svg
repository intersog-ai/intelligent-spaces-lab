<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="Montserrat, Helvetica, Arial, sans-serif"><rect width="760" height="600" fill="#F4F6F8"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA6B2"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" fill="#0E1A2B">The LLM proposes, code decides, devices confirm</text>
<text x="24" y="50" font-size="11.5" font-weight="400" fill="#5B6B7F">Intelligent Spaces Lab reference home. The main column runs with the internet off.</text>
<g fill="none" stroke="#9AA6B2" stroke-width="1.25">
<path d="M288 128V152" marker-end="url(#a)"/>
<path d="M288 208V232" marker-end="url(#a)"/>
<path d="M288 288V312" marker-end="url(#a)"/>
<path d="M288 384V408" marker-end="url(#a)"/>
<path d="M48 348H34V100H48" marker-end="url(#a)"/>
<path d="M528 260H648V240" marker-end="url(#a)"/>
<path d="M648 168V144" marker-end="url(#a)"/>
<path d="M560 348H544V424H528" marker-end="url(#a)"/>
<path d="M528 456H560" marker-end="url(#a)"/>
<path d="M648 480V504" marker-end="url(#a)"/>
<path d="M288 480V504" marker-start="url(#a)" marker-end="url(#a)"/></g>
<text x="300" y="304" font-size="11.5" font-weight="400" fill="#5B6B7F">proposed tool calls</text>
<text x="300" y="400" font-size="11.5" font-weight="400" fill="#5B6B7F">allowed calls only</text>
<text x="300" y="497" font-size="11.5" font-weight="400" fill="#5B6B7F">commands down, confirmed state up</text>
<rect x="48" y="72" width="480" height="56" rx="8" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.25"/>
<text x="64" y="96" font-size="13" font-weight="600" fill="#0E1A2B">People and phones</text>
<text x="64" y="113" font-size="11.5" font-weight="400" fill="#5B6B7F">Speak, override any rule, approve level-3 actions on the phone</text>
<rect x="48" y="152" width="480" height="56" rx="8" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.25"/>
<text x="64" y="176" font-size="13" font-weight="600" fill="#0E1A2B">Voice pipeline</text>
<text x="64" y="193" font-size="11.5" font-weight="400" fill="#5B6B7F">Wake word, VAD, speech to text, who is speaking, text to speech</text>
<rect x="48" y="232" width="480" height="56" rx="8" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.25"/>
<text x="64" y="256" font-size="13" font-weight="600" fill="#0E1A2B">Agent: local LLM with MCP tools</text>
<text x="64" y="273" font-size="11.5" font-weight="400" fill="#5B6B7F">Proposes tool calls; never touches a device directly</text>
<rect x="48" y="312" width="480" height="72" rx="8" fill="#E6F0FA" stroke="#0065BD" stroke-width="2"/>
<text x="64" y="336" font-size="13" font-weight="600" fill="#0E1A2B">Policy engine, written in code</text>
<text x="64" y="353" font-size="11.5" font-weight="400" fill="#0E1A2B">Level 1 act and tell · level 2 ask first · level 3 never alone</text>
<text x="64" y="369" font-size="11.5" font-weight="400" fill="#0E1A2B">Checks identity, reading freshness and approvals; writes the audit log</text>
<rect x="48" y="408" width="480" height="72" rx="8" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.25"/>
<text x="64" y="432" font-size="13" font-weight="600" fill="#0E1A2B">Home core: event bus, state store, action tracker</text>
<text x="64" y="449" font-size="11.5" font-weight="400" fill="#5B6B7F">Rules run safety loops, such as leak to valve, with no AI in them</text>
<text x="64" y="465" font-size="11.5" font-weight="400" fill="#5B6B7F">Every action ends confirmed, failed or timed out, never just sent</text>
<rect x="48" y="504" width="480" height="56" rx="8" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.25"/>
<text x="64" y="528" font-size="13" font-weight="600" fill="#0E1A2B">Devices</text>
<text x="64" y="545" font-size="11.5" font-weight="400" fill="#5B6B7F">Matter over Thread and Wi-Fi, Zigbee, cameras with local detection</text>
<rect x="560" y="72" width="176" height="72" rx="8" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.25"/>
<text x="576" y="96" font-size="13" font-weight="600" fill="#0E1A2B">Cloud, optional</text>
<text x="576" y="113" font-size="11.5" font-weight="400" fill="#5B6B7F">Fleet updates, backup,</text>
<text x="576" y="129" font-size="11.5" font-weight="400" fill="#5B6B7F">bigger model for text</text>
<rect x="560" y="168" width="176" height="72" rx="8" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.25"/>
<text x="576" y="192" font-size="13" font-weight="600" fill="#0E1A2B">Egress gate</text>
<text x="576" y="209" font-size="11.5" font-weight="400" fill="#5B6B7F">Allowlist, purpose tag,</text>
<text x="576" y="225" font-size="11.5" font-weight="400" fill="#5B6B7F">log line per call</text>
<rect x="560" y="312" width="176" height="72" rx="8" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.25"/>
<text x="576" y="336" font-size="13" font-weight="600" fill="#0E1A2B">Life safety</text>
<text x="576" y="353" font-size="11.5" font-weight="400" fill="#5B6B7F">Listed smoke/CO alarms</text>
<text x="576" y="369" font-size="11.5" font-weight="400" fill="#5B6B7F">sound on their own</text>
<rect x="560" y="408" width="176" height="72" rx="8" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.25"/>
<text x="576" y="432" font-size="13" font-weight="600" fill="#0E1A2B">Monitoring centre</text>
<text x="576" y="449" font-size="11.5" font-weight="400" fill="#5B6B7F">Receives alarms over</text>
<text x="576" y="465" font-size="11.5" font-weight="400" fill="#5B6B7F">SIA DC-09, calls 911</text>
<rect x="560" y="504" width="176" height="72" rx="8" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.25"/>
<text x="576" y="528" font-size="13" font-weight="600" fill="#0E1A2B">911 centre</text>
<text x="576" y="545" font-size="11.5" font-weight="400" fill="#5B6B7F">Data by ASAP to PSAP</text>
<text x="576" y="561" font-size="11.5" font-weight="400" fill="#5B6B7F">where supported</text>
</svg>